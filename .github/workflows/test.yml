name: Gestão de Alunos API - Testes CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  Testes Automatizados de API:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ FAZER CHECKOUT DO REPOSITÓRIO
        uses: actions/checkout@v4
      
      - name: DEFINIR VERSÃO DO NODE.JS
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: INSTALAR DEPENDÊNCIAS
        run: npm install

      - name: INICIAR A API
        run: npm start &

      - name: AGUARDAR A API ESTAR PRONTA
        run: sleep 10

      - name: RODAR TESTES
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ALUNO_EMAIL: ${{ secrets.ALUNO_EMAIL }}
          ALUNO_PASSWORD: ${{ secrets.ALUNO_PASSWORD }}
        run: npm test